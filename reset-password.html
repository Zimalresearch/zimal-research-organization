
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - ZRO</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: min(360px, 85%);
      box-shadow: 0 4px 20px #0002;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 9px 0;
    }
    button {
      background: #087b59;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div class="box">
    <h2>ZRO - Reset Password</h2>
    <p>Apna naya password darj karein.</p>

    <form id="resetForm">
      <input id="password" type="password"
        placeholder="New password" minlength="8" required>
      <input id="confirmPassword" type="password"
        placeholder="Confirm new password" minlength="8" required>
      <button type="submit">Save New Password</button>
    </form>

    <p id="message"></p>
  </div>

  <script>
    (async function () {
      const message = document.getElementById("message");
      const cfg = window.ZRO_CONFIG || {};

      if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY ||
          !window.supabase) {
        message.textContent = "Supabase configuration load nahi hui.";
        return;
      }

      const db = window.supabase.createClient(
        cfg.SUPABASE_URL,
        cfg.SUPABASE_ANON_KEY
      );

      const { data, error } = await db.auth.getSession();

      if (error || !data.session) {
        message.textContent =
          "Reset link valid nahi hai ya expire ho gaya hai. Nayi recovery email mangwayein.";
        return;
      }

      document.getElementById("resetForm").addEventListener(
        "submit", async function (event) {
          event.preventDefault();

          const password =
            document.getElementById("password").value;
          const confirmPassword =
            document.getElementById("confirmPassword").value;

          if (password !== confirmPassword) {
            message.textContent = "Dono passwords match nahi karte.";
            return;
          }

          message.textContent = "Password save ho raha hai...";

          const { error } = await db.auth.updateUser({ password });

          if (error) {
            message.textContent = error.message;
            return;
          }

          message.textContent =
            "Password successfully update ho gaya. Ab Admin Login page kholen.";
        }
      );
    })();
  </script>
</body>
</html>
